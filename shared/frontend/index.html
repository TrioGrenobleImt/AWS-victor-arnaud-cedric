<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FISA Shop</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#667085; --accent:#ff9900; --ok:#12b76a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
    header { background:#232f3e; color:#fff; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; }
    header small { color:#c7ced9; }
    main { max-width:1100px; margin:24px auto; padding:0 16px; display:grid; grid-template-columns: 2fr 1fr; gap:24px; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
    .card { background:var(--card); border-radius:10px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .price { font-weight:700; font-size:1.2em; }
    .muted { color:var(--muted); font-size:.9em; }
    input { width:100%; padding:8px; margin:4px 0 10px; border:1px solid #d0d5dd; border-radius:6px; }
    input[type=number] { width:70px; }
    button { background:var(--accent); border:0; padding:10px 14px; border-radius:6px; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .timeline span { display:inline-block; padding:4px 8px; border-radius:12px; background:#eaecf0; margin:2px; font-size:.85em; }
    .timeline span.done { background:var(--ok); color:#fff; }
    pre { white-space:pre-wrap; font-size:.8em; background:#f2f4f7; padding:8px; border-radius:6px; }
  </style>
</head>
<body>
<header>
  <strong>FISA Shop</strong>
  <small id="backend">backend: …</small>
</header>
<main>
  <section>
    <h2>Catalog</h2>
    <div id="catalog" class="grid">Loading…</div>
  </section>
  <aside>
    <div class="card">
      <h2>Your order</h2>
      <div id="cart" class="muted">Cart is empty.</div>
      <p class="row"><strong>Total</strong><strong id="total">0.00 €</strong></p>
      <label>Name<input id="name" value="Demo Customer"></label>
      <label>Email<input id="email" type="email" value="demo@example.com"></label>
      <button id="order" disabled>Place order</button>
    </div>
    <div class="card" id="confirmation" style="margin-top:16px; display:none">
      <h3>Confirmation</h3>
      <p id="confirmMsg"></p>
      <div class="timeline" id="timeline"></div>
      <pre id="orderJson"></pre>
    </div>
  </aside>
</main>
<script>
  // Same UI for both solutions: every call goes to the relative /api path
  // (ALB -> EC2 in solution 1, CloudFront -> API Gateway -> Lambda in solution 2).
  const cart = {};
  let products = [];
  const STEPS = ["PENDING", "PACKING", "SHIPPED"];

  async function api(path, options) {
    const res = await fetch("/api" + path, { headers: { "Content-Type": "application/json" }, ...options });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || res.statusText);
    return body;
  }

  function renderCart() {
    const lines = Object.entries(cart).filter(([, q]) => q > 0);
    let total = 0;
    document.getElementById("cart").innerHTML = lines.length ? lines.map(([id, q]) => {
      const p = products.find(x => x.id === id);
      total += p.price * q;
      return `<div class="row"><span>${q} × ${p.name}</span><span>${(p.price * q).toFixed(2)} €</span></div>`;
    }).join("") : "Cart is empty.";
    document.getElementById("total").textContent = total.toFixed(2) + " €";
    document.getElementById("order").disabled = !lines.length;
  }

  async function loadCatalog() {
    products = await api("/products");
    document.getElementById("catalog").innerHTML = products.map(p => `
      <div class="card">
        <h3>${p.name}</h3>
        <p class="muted">${p.description}</p>
        <div class="row">
          <span class="price">${p.price.toFixed(2)} €</span>
          <input type="number" min="0" max="10" value="0" data-id="${p.id}">
        </div>
        <p class="muted">${p.stock} in stock</p>
      </div>`).join("");
    document.querySelectorAll("#catalog input").forEach(i => i.addEventListener("input", e => {
      cart[e.target.dataset.id] = Math.max(0, Math.min(10, parseInt(e.target.value || "0", 10)));
      renderCart();
    }));
  }

  async function loadBackend() {
    try {
      const h = await api("/health");
      document.getElementById("backend").textContent = `backend: ${h.backend} · ${h.instance || ""} ${h.az || ""}`;
    } catch (e) { document.getElementById("backend").textContent = "backend: unreachable"; }
  }

  function renderStatus(order) {
    const idx = STEPS.indexOf(order.status);
    document.getElementById("timeline").innerHTML =
      STEPS.map((s, i) => `<span class="${i <= idx ? "done" : ""}">${s}</span>`).join("→");
    document.getElementById("orderJson").textContent = JSON.stringify(order, null, 2);
  }

  async function poll(orderId) {
    for (let i = 0; i < 30; i++) {
      const order = await api("/orders/" + orderId);
      renderStatus(order);
      if (order.status === "SHIPPED") return;
      await new Promise(r => setTimeout(r, 2000));
    }
  }

  document.getElementById("order").addEventListener("click", async () => {
    const btn = document.getElementById("order");
    btn.disabled = true;
    try {
      const items = Object.entries(cart).filter(([, q]) => q > 0).map(([product_id, quantity]) => ({ product_id, quantity }));
      const res = await api("/orders", { method: "POST", body: JSON.stringify({
        customer_name: document.getElementById("name").value,
        customer_email: document.getElementById("email").value,
        items,
      }) });
      document.getElementById("confirmation").style.display = "block";
      document.getElementById("confirmMsg").textContent = res.message;
      renderStatus(res);
      poll(res.order_id);
    } catch (e) {
      alert("Order failed: " + e.message);
    } finally {
      btn.disabled = false;
    }
  });

  loadBackend();
  loadCatalog().catch(e => document.getElementById("catalog").textContent = "Error: " + e.message);
</script>
</body>
</html>
