<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#414d5c'/></marker><marker id='ad' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#8d99a8'/></marker></defs>
<rect width='1400' height='720' fill='#ffffff'/>
<text x='30' y='42' font-size='24' font-weight='700' fill='#16191f'>FISA Shop — 4 · build, monitoring and guardrails</text>
<text x='30' y='66' font-size='14' fill='#5f6b7a'>terraform apply builds and deploys everything; CloudWatch alarms, CloudTrail and a cost budget watch the account</text>
<rect x='20' y='100' width='1360' height='200' fill='none' stroke='#5f6b7a' stroke-width='1.5' stroke-dasharray='6 4'/>
<text x='30' y='118' font-size='13' font-weight='700' fill='#5f6b7a'>Build and deploy</text>
<g><rect x='40' y='140' width='230' height='110' rx='6' fill='#fff' stroke='#E7157B' stroke-width='1.6'/><rect x='50' y='152' width='34' height='34' rx='4' fill='#E7157B'/><text x='67' y='173' font-size='10.5' font-weight='700' fill='#fff' text-anchor='middle'>TF</text><text x='92' y='166' font-size='13.5' font-weight='700' fill='#16191f'>Terraform</text>
<text x='92' y='183' font-size='11.5' fill='#5f6b7a'>terraform apply</text>
<text x='92' y='198' font-size='11.5' fill='#5f6b7a'>docker buildx → push</text>
<text x='92' y='213' font-size='11.5' fill='#5f6b7a'>tag = hash of backend/</text>
</g>
<g><rect x='340' y='140' width='220' height='96' rx='6' fill='#fff' stroke='#ED7100' stroke-width='1.6'/><rect x='350' y='152' width='34' height='34' rx='4' fill='#ED7100'/><text x='367' y='173' font-size='10.5' font-weight='700' fill='#fff' text-anchor='middle'>ECR</text><text x='392' y='166' font-size='13.5' font-weight='700' fill='#16191f'>Amazon ECR</text>
<text x='392' y='183' font-size='11.5' fill='#5f6b7a'>immutable tags</text>
<text x='392' y='198' font-size='11.5' fill='#5f6b7a'>scan on push</text>
</g>
<g><rect x='630' y='140' width='230' height='96' rx='6' fill='#fff' stroke='#ED7100' stroke-width='1.6'/><rect x='640' y='152' width='34' height='34' rx='4' fill='#ED7100'/><text x='657' y='173' font-size='10.5' font-weight='700' fill='#fff' text-anchor='middle'>ECS</text><text x='682' y='166' font-size='13.5' font-weight='700' fill='#16191f'>ECS services</text>
<text x='682' y='183' font-size='11.5' fill='#5f6b7a'>rolling deployment</text>
<text x='682' y='198' font-size='11.5' fill='#5f6b7a'>circuit breaker</text>
<text x='682' y='213' font-size='11.5' fill='#5f6b7a'>+ automatic rollback</text>
</g>
<g><rect x='920' y='140' width='210' height='96' rx='6' fill='#fff' stroke='#ED7100' stroke-width='1.6'/><rect x='930' y='152' width='34' height='34' rx='4' fill='#ED7100'/><text x='947' y='173' font-size='10.5' font-weight='700' fill='#fff' text-anchor='middle'>λ</text><text x='972' y='166' font-size='13.5' font-weight='700' fill='#16191f'>Lambda functions</text>
<text x='972' y='183' font-size='11.5' fill='#5f6b7a'>3 zips: function</text>
<text x='972' y='198' font-size='11.5' fill='#5f6b7a'>+ shared lib/</text>
<text x='972' y='213' font-size='11.5' fill='#5f6b7a'>one IAM role each</text>
</g>
<g><rect x='1160' y='140' width='200' height='96' rx='6' fill='#fff' stroke='#7AA116' stroke-width='1.6'/><rect x='1170' y='152' width='34' height='34' rx='4' fill='#7AA116'/><text x='1187' y='173' font-size='10.5' font-weight='700' fill='#fff' text-anchor='middle'>S3</text><text x='1212' y='166' font-size='13.5' font-weight='700' fill='#16191f'>S3 site buckets</text>
<text x='1212' y='183' font-size='11.5' fill='#5f6b7a'>storefront and back</text>
<text x='1212' y='198' font-size='11.5' fill='#5f6b7a'>office dist/ uploads</text>
</g>
