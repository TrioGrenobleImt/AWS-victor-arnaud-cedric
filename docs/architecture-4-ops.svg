<text x='30' y='348' font-size='13' font-weight='700' fill='#E7157B'>Monitoring</text>
<g><rect x='40' y='370' width='230' height='84' rx='6' fill='#fff' stroke='#8C4FFF' stroke-width='1.6'/><rect x='50' y='382' width='34' height='34' rx='4' fill='#8C4FFF'/><text x='67' y='403' font-size='10.5' font-weight='700' fill='#fff' text-anchor='middle'>ALB</text><text x='92' y='396' font-size='13.5' font-weight='700' fill='#16191f'>ALB · ECS services</text>
<text x='92' y='413' font-size='11.5' fill='#5f6b7a'>requests · 5xx · CPU</text>
<text x='92' y='428' font-size='11.5' fill='#5f6b7a'>healthy tasks · logs</text>
</g>
<g><rect x='40' y='470' width='230' height='70' rx='6' fill='#fff' stroke='#ED7100' stroke-width='1.6'/><rect x='50' y='482' width='34' height='34' rx='4' fill='#ED7100'/><text x='67' y='503' font-size='10.5' font-weight='700' fill='#fff' text-anchor='middle'>λ</text><text x='92' y='496' font-size='13.5' font-weight='700' fill='#16191f'>Lambda functions</text>
<text x='92' y='513' font-size='11.5' fill='#5f6b7a'>invocations · errors · logs</text>
</g>
<g><rect x='40' y='555' width='230' height='60' rx='6' fill='#fff' stroke='#E7157B' stroke-width='1.6'/><rect x='50' y='567' width='34' height='34' rx='4' fill='#E7157B'/><text x='67' y='588' font-size='10.5' font-weight='700' fill='#fff' text-anchor='middle'>SQS</text><text x='92' y='581' font-size='13.5' font-weight='700' fill='#16191f'>SQS dead-letter queues</text>
<text x='92' y='598' font-size='11.5' fill='#5f6b7a'>messages visible</text>
</g>
<g><rect x='340' y='365' width='270' height='160' rx='6' fill='#fff' stroke='#E7157B' stroke-width='1.6'/><rect x='350' y='377' width='34' height='34' rx='4' fill='#E7157B'/><text x='367' y='398' font-size='10.5' font-weight='700' fill='#fff' text-anchor='middle'>CW</text><text x='392' y='391' font-size='13.5' font-weight='700' fill='#16191f'>CloudWatch</text>
<text x='392' y='408' font-size='11.5' fill='#5f6b7a'>logs · 7-day retention</text>
<text x='392' y='423' font-size='11.5' fill='#5f6b7a'>dashboard · 5 widgets</text>
<text x='392' y='438' font-size='11.5' fill='#5f6b7a'>alarms:</text>
<text x='392' y='453' font-size='11.5' fill='#5f6b7a'>• DLQ not empty (×2)</text>
<text x='392' y='468' font-size='11.5' fill='#5f6b7a'>• Lambda errors (each)</text>
<text x='392' y='483' font-size='11.5' fill='#5f6b7a'>• API 5xx &gt; 5 in 5 min</text>
<text x='392' y='498' font-size='11.5' fill='#5f6b7a'>• unhealthy shop-api task</text>
</g>
<g><rect x='670' y='380' width='190' height='70' rx='6' fill='#fff' stroke='#E7157B' stroke-width='1.6'/><rect x='680' y='392' width='34' height='34' rx='4' fill='#E7157B'/><text x='697' y='413' font-size='10.5' font-weight='700' fill='#fff' text-anchor='middle'>SNS</text><text x='722' y='406' font-size='13.5' font-weight='700' fill='#16191f'>SNS alerts</text>
<text x='722' y='423' font-size='11.5' fill='#5f6b7a'>alarm actions</text>
</g>
<g><rect x='670' y='520' width='190' height='70' rx='6' fill='#fff' stroke='#232F3E' stroke-width='1.6'/><rect x='680' y='532' width='34' height='34' rx='4' fill='#232F3E'/><text x='697' y='553' font-size='10.5' font-weight='700' fill='#fff' text-anchor='middle'>@</text><text x='722' y='546' font-size='13.5' font-weight='700' fill='#16191f'>Operator</text>
<text x='722' y='563' font-size='11.5' fill='#5f6b7a'>notification_email</text>
</g>
