<text x='30' y='42' font-size='24' font-weight='700' fill='#16191f'>FISA Shop — 1 · web entry</text>
<text x='30' y='66' font-size='14' fill='#5f6b7a'>Two CloudFront distributions, one per site: each serves its own S3 bucket, the shared images bucket and its API path</text>
