<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FISA Records</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-disc" aria-hidden="true"></span>
      <span>FISA <em>Records</em></span>
    </a>
    <input id="search" class="search" type="search" placeholder="Search artist, album, genre…" aria-label="Search the catalog">
    <button id="openCrate" class="crate-btn" type="button">
      Crate <span id="crateCount" class="badge">0</span>
    </button>
  </header>

  <section class="hero">
    <div>
      <p class="eyebrow">Independent vinyl shop · since 2026</p>
      <h1>Dig the crates.<br>Drop the needle.</h1>
      <p class="lede">Hand-picked pressings, reissues and limited colour vinyl, shipped in sturdy mailers.</p>
    </div>
    <div class="turntable" aria-hidden="true">
      <div class="platter"><div class="record"><div class="label"></div></div></div>
      <div class="tonearm"></div>
    </div>
  </section>

  <main>
    <nav id="genres" class="genres" aria-label="Filter by genre"></nav>
    <div id="catalog" class="catalog" aria-live="polite"><p class="muted">Loading the crates…</p></div>
  </main>

  <footer class="footer">
    <span id="backend">backend: …</span>
  </footer>

  <div id="scrim" class="scrim" hidden></div>
  <aside id="crate" class="drawer" aria-label="Your crate" aria-hidden="true">
    <div class="drawer-head">
      <h2>Your crate</h2>
      <button id="closeCrate" class="icon-btn" type="button" aria-label="Close">✕</button>
    </div>

    <div id="cartView">
      <div id="cartLines" class="lines"></div>
      <p class="total-row"><span>Total</span><strong id="total">0.00 €</strong></p>
      <form id="checkout" class="checkout">
        <label>Name<input id="name" required value="Demo Customer"></label>
        <label>Email<input id="email" type="email" required value="demo@example.com"></label>
        <p id="checkoutError" class="error" hidden></p>
        <button id="placeOrder" class="primary" type="submit" disabled>Place order</button>
      </form>
    </div>

    <div id="trackView" hidden>
      <p id="confirmMsg" class="confirm"></p>
      <ol id="timeline" class="timeline"></ol>
      <details>
        <summary>Order details (raw)</summary>
        <pre id="orderJson"></pre>
      </details>
      <button id="keepShopping" class="secondary" type="button">Keep digging</button>
    </div>
  </aside>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
